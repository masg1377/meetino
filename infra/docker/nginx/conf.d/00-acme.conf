# ─────────────────────────────────────────────────────────────
# ACME (Let's Encrypt) HTTP-01 challenge.
# All three vhosts (meetino, api, livekit) share this :80 catch-all
# so certbot --webroot can answer challenges from any domain.
#
# Everything else on :80 is redirected to HTTPS by the per-domain
# server blocks in 10-meetino.conf / 20-api.conf / 30-livekit.conf.
# ─────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 webroot. certbot writes proofs here; nginx serves them.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Health probe (for the nginx container's own healthcheck).
    location = / {
        return 200 'meetino-edge\n';
        add_header Content-Type text/plain;
    }

    # Force everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}
