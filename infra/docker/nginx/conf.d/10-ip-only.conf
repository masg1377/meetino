# ─────────────────────────────────────────────────────────────
# Meetino — single-vhost config (IP + ArvanCloud domain, no subdomain).
#
# همه سرویس‌ها روی یک آدرس، پورت 443:
#   /          → web (Next.js)
#   /api/      → api (NestJS REST)
#   /realtime/ → api (Socket.IO WebSocket)
#   /livekit/  → livekit:7880 (signaling WebSocket)
#
# SSL: self-signed cert در ./certs/ که روی /etc/selfsigned mount شده.
# ─────────────────────────────────────────────────────────────

upstream livekit_upstream {
    server host.docker.internal:7880;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name server-5d3fcb9b-50a6-4a7a-94e9-267160c8bb19.ir-thr-ba1.arvancompute.ir 188.121.117.190;

    ssl_certificate     /etc/selfsigned/fullchain.pem;
    ssl_certificate_key /etc/selfsigned/privkey.pem;
    ssl_session_cache   shared:MeetinoSSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    client_max_body_size 30m;
    client_body_buffer_size 1m;

    # ── LiveKit signaling WebSocket ───────────────────────────────
    location /livekit/ {
        proxy_pass http://livekit_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;
    }

    # ── Socket.IO WebSocket ───────────────────────────────────────
    # Socket.IO always uses /socket.io/ as its engine.io transport path,
    # regardless of the namespace (/realtime). Both paths must be proxied.
    location /socket.io/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;
    }

    location /realtime/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;
    }

    # ── REST API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_request_buffering off;
        client_max_body_size 30m;
    }

    # ── Web frontend (Next.js) — باید آخر باشد ───────────────────
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
