# ─────────────────────────────────────────────────────────────
# Meetino — top-level nginx.conf
# Per-vhost configs live in /etc/nginx/conf.d/*.conf
# ─────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format  meetino  '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time uct=$upstream_connect_time '
                        'urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  meetino;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    server_tokens     off;

    # 30 MB upload cap (matches MEDIA_MAX_FILE_BYTES default of 25 MB
    # plus the multipart overhead). Bump together if the env limit grows.
    client_max_body_size 30m;
    # Buffer client request body to disk for big uploads.
    client_body_buffer_size 1m;

    # Gzip — Brotli would need nginx-brotli; gzip is plenty for the
    # mostly-JS/CSS payload Next ships.
    gzip                on;
    gzip_vary           on;
    gzip_comp_level     5;
    gzip_min_length     1024;
    gzip_proxied        any;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # WebSocket upgrade map — used by api + livekit vhosts.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
